name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify unit tests exist
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path . -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\node_modules\\|\\dist\\|\\release\\' -and
              $_.Name -match '\.(test|spec)\.[jt]sx?$'
            }
          if (-not $tests) {
            Write-Error "No unit tests found (*.test.* / *.spec.*)."
            exit 1
          }
          Write-Host "Found $($tests.Count) test file(s)."

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
